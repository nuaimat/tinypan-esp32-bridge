name: Build & Release

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone --depth 1 -b v5.4 https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32

      - name: Build firmware
        run: |
          . ~/esp/esp-idf/export.sh
          idf.py build

      - name: Create merged binary
        run: |
          . ~/esp/esp-idf/export.sh
          python -m esptool --chip esp32 merge_bin -o tinypan_bridge_merged.bin \
            --flash_mode dio --flash_size 4MB --flash_freq 40m \
            0x1000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/tinypan_bridge.bin \
            0x200000 build/www.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tinypan_bridge_merged.bin
            build/tinypan_bridge.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/www.bin
